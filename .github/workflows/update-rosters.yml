name: Update fantasy rosters

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC). GitHub may delay by a few minutes.
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed so the workflow can push rosters.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rosters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_Y: ${{ secrets.YAHOO_Y }}
          YAHOO_T: ${{ secrets.YAHOO_T }}
        run: python fantasy_tracker.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rosters.json
          # "git diff --staged --quiet" exits 0 if nothing changed -> skip commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rosters $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
