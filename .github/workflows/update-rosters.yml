name: Update fantasy rosters

on:
  schedule:
    - cron: "23 */4 * * *"  # every 4 hours at :23 UTC. Off-the-hour minutes get skipped less often by GitHub.
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed so the workflow can push rosters.json
  actions: write             # needed to (re)start the keepalive scheduler

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rosters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_Y: ${{ secrets.YAHOO_Y }}
          YAHOO_T: ${{ secrets.YAHOO_T }}
        run: python fantasy_tracker.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rosters.json
          # "git diff --staged --quiet" exits 0 if nothing changed -> skip commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rosters $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Make sure the keepalive scheduler is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keepalive.yml \
                     --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keepalive.yml \
                     --status queued --json databaseId --jq 'length')
          if [ "$((active + queued))" -eq 0 ]; then
            echo "Keepalive not running - starting it."
            gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "Could not start keepalive (will retry next run)."
          else
            echo "Keepalive already running ($active active, $queued queued)."
          fi
