name: Keepalive scheduler

# GitHub's built-in cron is unreliable for this repo, so this workflow keeps the
# refresh going by itself: refresh rosters -> wait ~2 hours -> start the next
# cycle. Public repos get free Actions minutes, so the wait costs nothing.
# Start it once with "Run workflow"; after that it re-launches itself, and
# update-rosters.yml restarts it automatically if it ever stops.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refresh rosters now
        run: |
          for attempt in 1 2 3; do
            gh workflow run update-rosters.yml --repo "$GITHUB_REPOSITORY" --ref main && break
            sleep 30
          done

      - name: Wait about 2 hours
        run: sleep 7100

      - name: Start the next cycle
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Next cycle queued."; exit 0
            fi
            echo "Dispatch failed (attempt $attempt), retrying in 60s..."; sleep 60
          done
          echo "Could not queue the next cycle." >&2; exit 1
