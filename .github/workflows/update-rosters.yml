name: Update fantasy rosters

on:
  schedule:
    - cron: "23 */2 * * *"  # every 2 hours at :23 UTC (GitHub often runs these late or skips them;
                            # the "Keepalive scheduler" workflow is the reliable driver)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed so the workflow can push rosters.json / rosters.txt
  actions: write             # needed to (re)start the keepalive scheduler

concurrency:
  group: update-rosters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch rosters
        id: fetch
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_Y: ${{ secrets.YAHOO_Y }}
          YAHOO_T: ${{ secrets.YAHOO_T }}
        run: |
          # Don't stop the job on a problem: commit whatever data we have first,
          # then report the problem in the last step so the run still turns red.
          set +e
          python fantasy_tracker.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rosters.json rosters.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rosters $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Retry the push a few times in case another run pushed in between.
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase && sleep 5
            done
          fi

      - name: Make sure the keepalive scheduler is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keepalive.yml --limit 10 \
                     --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${active:-0}" -eq 0 ]; then
            echo "Keepalive not running - starting it."
            gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "Could not start keepalive (will retry next run)."
          else
            echo "Keepalive already running ($active active/queued)."
          fi

      - name: Report problems
        if: always()
        run: |
          code="${{ steps.fetch.outputs.exit_code }}"
          if [ -z "$code" ] || [ "$code" != "0" ]; then
            echo "::error::fantasy_tracker.py reported a problem (exit code ${code:-unknown}). See the 'Fetch rosters' step. Data was still committed."
            exit 1
          fi
          echo "All sources OK."
